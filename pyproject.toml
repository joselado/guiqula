[build-system]
# 77: the license as an SPDX expression (PEP 639)
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guiqula"
dynamic = ["version"]
description = "Graphical workbench for the pyqula tight-binding library"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["tight-binding", "condensed matter", "topology", "pyqula", "physics", "GUI"]
authors = [
    {name = "Jose Lado", email = "jose.lado@aalto.fi"},
]
# 3.12 and 3.13: the versions the whole test suite has run on (phase-6 answer 44).
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # guiqula itself (PLAN.md section 6). PySide6-Essentials, not the full
    # PySide6: the Addons wheel is not needed (14.4). 6.6 is the first
    # release with Python 3.12 wheels.
    "PySide6-Essentials>=6.6",
    "pydantic>=2.8",
    "platformdirs>=3.10",
    # The vendored pyqula's runtime dependencies, mirrored from
    # vendor/VENDOR.md (tests/test_packaging.py checks they stay in sync).
    "numpy>=2.1",
    "scipy>=1.13.1",
    "matplotlib>=3.10.0",
    "numba>=0.60.0",
    "multiprocess>=0.70.19",
    "dill>=0.4.1",
    "threadpoolctl>=3.5.0",
    "jax>=0.8.1",
]

[project.optional-dependencies]
fast = ["pyqtgraph>=0.13"]
# View > 3D drawing: pyvista (and VTK) draw in 3D; 0.48 is the version tested
3d = ["pyvista>=0.48"]
# setuptools: tests/test_packaging.py builds the sdist and the wheel without isolation
test = ["pytest>=7.4", "pytest-qt>=4.4", "setuptools>=77", "build"]

[project.urls]
Homepage = "https://github.com/joselado/guiqula"
Source = "https://github.com/joselado/guiqula"
Issues = "https://github.com/joselado/guiqula/issues"
pyqula = "https://github.com/joselado/pyqula"

[project.scripts]
guiqula = "guiqula.__main__:main"

[tool.setuptools.dynamic]
version = {attr = "guiqula.__version__"}

# The package list is computed in setup.py. vendor/pyqula ships inside the
# package as guiqula/_vendor/pyqula (decision 3); guiqula.vendoring puts
# guiqula/_vendor on sys.path so that it imports as top-level pyqula.
[tool.setuptools.package-dir]
"" = "src"
"guiqula._vendor.pyqula" = "vendor/pyqula"

[tool.setuptools.package-data]
guiqula = ["presets/*.json", "docs/*.md", "resources/*"]
"guiqula._vendor.pyqula" = ["datasets/*.txt"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.nbi", "*.nbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
qt_api = "pyside6"
markers = [
    "slow: builds a wheel or runs a long calculation (deselect with -m 'not slow')",
]
