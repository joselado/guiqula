# A guiqula plugin (guiqula's PLAN.md 3.2, phase 6): copy this directory, rename the
# package, and declare your module in the entry point group "guiqula.plugins".
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guiqula-example-plugin"
version = "0.1.0"
description = "An example guiqula plugin: the chiral Kekule hopping of pyqula"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# guiqula brings pyqula (vendored), numpy and the rest
dependencies = ["guiqula"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.entry-points."guiqula.plugins"]
example = "guiqula_example_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
