# Release artifacts (PLAN.md section 6, phase 6): the sdist and wheel, the PyInstaller
# folders with a smoke test each, the Windows installer and the macOS disk image; on a
# tag v*, the upload to PyPI through trusted publishing (configure the "pypi"
# environment and the publisher on PyPI first). Written before the repository had a
# remote: it has not run yet.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  bundles:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: macos-13
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip && python -m pip install . pyinstaller
      - run: pyinstaller packaging/pyinstaller/guiqula.spec --noconfirm
      - name: Smoke test (the workers of a frozen guiqula)
        shell: bash
        run: |
          cd dist
          ./guiqula/guiqula-cli --version
          ./guiqula/guiqula-cli run honeycomb_zeeman_rashba --calc c1 --out smoke
          test -f smoke/c1.npz
      - name: Version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import guiqula; print(guiqula.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Linux archive
        if: runner.os == 'Linux'
        run: tar -czf dist/guiqula-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz -C dist guiqula
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: hdiutil create -volname guiqula -srcfolder dist/guiqula.app -ov -format UDZO dist/guiqula-${{ steps.version.outputs.version }}-${{ matrix.name }}.dmg
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          iscc //DVersion=${{ steps.version.outputs.version }} packaging/windows/guiqula.iss
      - uses: actions/upload-artifact@v4
        with:
          name: guiqula-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe

  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, bundles]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
