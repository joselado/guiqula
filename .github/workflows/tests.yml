# The test suite on Linux, macOS and Windows (PLAN.md section 6, phase 6). Written before
# the repository had a remote: it has not run yet.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt's system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils
      - name: Dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]" build twine
      - name: Tests (offscreen Qt, worker processes)
        run: python -m pytest -q -x
